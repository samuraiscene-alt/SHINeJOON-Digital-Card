<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>SHINeJOON | Digital Card</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>

<body>
  <main class="shell">

    <section class="hero-card">
      <img id="profileImage" class="hero-image" src="profile.jpeg" alt="신이준 프로필 사진" />
      <div class="hero-wash"></div>

      <div class="hero-copy">
        <p class="hero-label">DIGITAL CARD</p>
        <h1 id="displayName">신이준</h1>
        <p id="displaySubName" class="subname">SHINeJOON</p>
        <div class="hero-line"></div>
        <p id="displayBio" class="bio">
          프로필 문구를 관리자 화면에서 추가할 수 있습니다.
        </p>
      </div>
    </section>

    <section class="quick-grid" aria-label="빠른 연락">
      <a class="quick" href="tel:01052227428">
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/>
          </svg>
        </span>
        <b>전화</b>
      </a>

      <a class="quick" href="sms:01052227428">
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
          </svg>
        </span>
        <b>문자</b>
      </a>

      <a class="quick" href="mailto:samuraiscene@gmail.com">
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
        </span>
        <b>이메일</b>
      </a>

      <a
        class="quick"
        target="_blank"
        rel="noopener"
        href="https://www.instagram.com/shine_joon"
      >
        <span class="quick-icon instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1"/>
          </svg>
        </span>
        <b>Instagram</b>
      </a>
    </section>

    <section class="utility-card">
      <a class="utility-item" href="shinejoon.vcf" download>
        <span class="utility-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c.8-4.4 3.5-7 8-7s7.2 2.6 8 7"/>
          </svg>
        </span>
        <b>연락처 저장</b>
      </a>

      <button class="utility-item disabled" data-label="카카오톡" type="button">
        <span class="utility-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11.2c0 4-3.6 7.2-8 7.2-1 0-2-.2-2.9-.5L5 20l1.1-3.5C4.8 15.2 4 13.3 4 11.2 4 7.2 7.6 4 12 4s8 3.2 8 7.2z"/>
          </svg>
        </span>
        <b>카카오톡</b>
      </button>

      <a
        class="utility-item"
        target="_blank"
        rel="noopener"
        href="https://www.google.com/maps/search/?api=1&query=%EC%84%9C%EC%9A%B8%EC%8B%9C+%EC%84%B1%EB%B6%81%EA%B5%AC+%EC%84%B1%EB%B6%81%EB%A1%9C"
      >
        <span class="utility-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/>
            <circle cx="12" cy="10" r="2.5"/>
          </svg>
        </span>
        <b>지도</b>
      </a>

      <button class="utility-item" id="shareBtn" type="button">
        <span class="utility-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V3"/>
            <path d="M8 7l4-4 4 4"/>
            <path d="M5 11v8h14v-8"/>
          </svg>
        </span>
        <b>명함 공유</b>
      </button>
    </section>

    <section class="portfolio-section">
      <button
        class="portfolio-cta disabled"
        data-label="포트폴리오"
        type="button"
      >
        <span class="portfolio-icon">▰</span>

        <span class="portfolio-copy">
          <b>포트폴리오 보기</b>
          <small>프로젝트와 작업물을 확인해보세요</small>
        </span>

        <span class="portfolio-arrow">›</span>
      </button>
    </section>

    <section class="gallery-card">
      <div class="gallery-head">
        <h2>Gallery</h2>
      </div>

      <div class="gallery-slider">
        <button
          class="gallery-arrow gallery-prev"
          type="button"
          aria-label="이전 사진"
        >
          ‹
        </button>

        <div class="gallery-stage">
          <div class="gallery-frame">
            <img
              id="galleryImage"
              src="profile.jpeg"
              alt="갤러리 사진"
            />
          </div>

          <div class="gallery-dots">
            <span class="dot active"></span>
          </div>
        </div>

        <button
          class="gallery-arrow gallery-next"
          type="button"
          aria-label="다음 사진"
        >
          ›
        </button>
      </div>
    </section>

    <section class="sns-card">
      <h2>SNS</h2>

      <div class="sns-grid">
        <button
          class="sns-item disabled"
          data-label="YouTube"
          type="button"
        >
          <span class="sns-icon youtube">▶</span>
          <b>YouTube</b>
        </button>

        <button
          class="sns-item disabled"
          data-label="TikTok"
          type="button"
        >
          <span class="sns-icon tiktok">♪</span>
          <b>TikTok</b>
        </button>

        <button
          class="sns-item disabled"
          data-label="Facebook"
          type="button"
        >
          <span class="sns-icon facebook">f</span>
          <b>Facebook</b>
        </button>
      </div>
    </section>

    <section class="qr-card">
      <div class="qr-copy">
        <div class="qr-title">
          <span class="qr-scan">⌗</span>

          <div>
            <h2>명함 QR</h2>
            <p>
              QR 코드를 스캔하여<br>
              제 디지털 명함을 저장해보세요.
            </p>
          </div>
        </div>
      </div>

      <div id="qrBox" class="qr-placeholder">
        <img
          src="SHINeJOON_Digital_Card_QR_v2.png"
          alt="SHINeJOON 디지털 명함 QR 코드"
        />
      </div>
    </section>

    <footer>
      <p>© 2026 SHINeJOON. All rights reserved.</p>
      <a href="admin.html">관리자</a>
    </footer>

  </main>

  <script src="app.js?v=2"></script>
</body>
</html>
