<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>SHINeJOON | Digital Card</title>
  <link rel="stylesheet" href="style.css?v=3" />
</head>

<body>
  <main class="shell">

    <!-- HERO -->
    <section class="hero hero-apple">
      <div class="hero-photo">

        <img
          id="profileImage"
          class="profile hero-cover"
          src="profile.jpeg"
          alt="신이준 프로필 사진"
        />

        <div class="hero-overlay"></div>

        <div class="hero-copy">
          <p class="eyebrow">DIGITAL CARD</p>

          <h1 id="displayName">신이준</h1>

          <p id="displaySubName" class="subname">
            SHINeJOON
          </p>

          <p id="displayBio" class="bio">
            프로필 문구를 관리자 화면에서 추가할 수 있습니다.
          </p>
        </div>

      </div>
    </section>


    <!-- QUICK CONTACT -->
    <section class="quick-grid" aria-label="빠른 연락">

      <a class="quick" href="tel:01052227428">
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.33 1.78.62 2.63a2 2 0 0 1-.45 2.11L8 9.73a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0 1 22 16.92z"/>
          </svg>
        </span>
        <b>전화</b>
      </a>


      <a class="quick" href="sms:01052227428">
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
          </svg>
        </span>
        <b>문자</b>
      </a>


      <a class="quick" href="mailto:samuraiscene@gmail.com">
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="M3 7l9 6 9-6"/>
          </svg>
        </span>
        <b>이메일</b>
      </a>


      <a
        class="quick"
        target="_blank"
        rel="noopener"
        href="https://www.instagram.com/shine_joon"
      >
        <span class="quick-icon">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="17.5" cy="6.5" r="1"/>
          </svg>
        </span>
        <b>Instagram</b>
      </a>

    </section>


    <!-- MAIN ACTIONS -->
    <section class="card stack">

      <a class="row" href="shinejoon.vcf" download>
        <span class="ico">👤</span>

        <span>
          <b>연락처 저장</b>
          <small>전화 · 이메일 · 인스타 · 주소</small>
        </span>

        <span class="chevron">›</span>
      </a>


      <button
        class="row disabled"
        data-label="카카오톡"
        type="button"
      >
        <span class="ico">💬</span>

        <span>
          <b>카카오톡</b>
          <small>오픈채팅/채널 링크 추가 예정</small>
        </span>

        <span class="chevron">›</span>
      </button>


      <a
        class="row"
        target="_blank"
        rel="noopener"
        href="https://www.google.com/maps/search/?api=1&query=%EC%84%9C%EC%9A%B8%EC%8B%9C+%EC%84%B1%EB%B6%81%EA%B5%AC+%EC%84%B1%EB%B6%81%EB%A1%9C"
      >
        <span class="ico">📍</span>

        <span>
          <b>지도 보기</b>
          <small>서울시 성북구 성북로</small>
        </span>

        <span class="chevron">›</span>
      </a>


      <button
        class="row"
        id="shareBtn"
        type="button"
      >
        <span class="ico">↗︎</span>

        <span>
          <b>명함 공유</b>
          <small>현재 페이지 주소 공유</small>
        </span>

        <span class="chevron">›</span>
      </button>

    </section>


    <!-- PORTFOLIO -->
    <section class="portfolio-section">

      <button
        class="portfolio-cta disabled"
        data-label="포트폴리오"
        type="button"
      >

        <span class="portfolio-icon">
          ▣
        </span>

        <span class="portfolio-copy">
          <small>PORTFOLIO</small>

          <b>포트폴리오 보기</b>

          <em>
            경력 · 프로젝트 · 작업물을 확인하세요
          </em>
        </span>

        <span class="portfolio-arrow">
          ›
        </span>

      </button>

    </section>


    <!-- GALLERY -->
    <section class="gallery-section">

      <div class="section-head">
        <div>
          <span class="section-kicker">
            GALLERY
          </span>

          <h2>사진</h2>
        </div>
      </div>


      <div class="gallery-slider">

        <button
          class="gallery-arrow gallery-prev"
          type="button"
          aria-label="이전 사진"
        >
          ‹
        </button>


        <div class="gallery-frame">

          <img
            id="galleryImage"
            src="profile.jpeg"
            alt="갤러리 사진"
          />

          <div class="gallery-dots">
            <span class="dot active"></span>
          </div>

        </div>


        <button
          class="gallery-arrow gallery-next"
          type="button"
          aria-label="다음 사진"
        >
          ›
        </button>

      </div>

    </section>


    <!-- SNS -->
    <section class="card links">

      <button
        class="mini disabled"
        data-label="YouTube"
        type="button"
      >
        ▶ <span>YouTube</span>
      </button>


      <button
        class="mini disabled"
        data-label="TikTok"
        type="button"
      >
        ♪ <span>TikTok</span>
      </button>


      <button
        class="mini disabled"
        data-label="Facebook"
        type="button"
      >
        f <span>Facebook</span>
      </button>

    </section>


    <!-- QR -->
    <section class="card qr-card">

      <div class="qr-copy">

        <span class="section-kicker">
          SHARE
        </span>

        <h2>내 명함 QR</h2>

        <p class="muted">
          카메라로 스캔하면 이 디지털 명함을 바로 열 수 있습니다.
        </p>

      </div>


      <div
        id="qrBox"
        class="qr-placeholder"
      >

        <img
          src="SHINeJOON_Digital_Card_QR_v2.png"
          alt="SHINeJOON 디지털 명함 QR 코드"
        />

      </div>

    </section>


    <!-- FOOTER -->
    <footer>

      <p>
        SHINeJOON DIGITAL CARD
      </p>

      <a href="admin.html">
        관리자
      </a>

    </footer>

  </main>


  <script src="app.js?v=2"></script>

</body>
</html>
